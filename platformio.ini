; PlatformIO build for NodeMCU v3 (LoLin, ESP-12E / ESP8266, CH340 USB-serial, 4MB flash).
; PlatformIO's "nodemcuv2" board definition matches this hardware.
; The sketch stays in Watering_System/ so it still opens in the Arduino IDE.

[platformio]
src_dir = Watering_System

[env:nodemcuv3]
platform = espressif8266
board = nodemcuv2
framework = arduino

board_build.f_cpu = 160000000L   ; faster TLS handshakes with the MQTT broker

; The sketch stores schedules with SPIFFS - keep it so saved data survives updates.
board_build.filesystem = spiffs
board_build.ldscript = eagle.flash.4m1m.ld   ; 4MB flash: 1MB filesystem

build_flags = -Wno-deprecated-declarations   ; silence "SPIFFS is deprecated"

upload_speed = 460800        ; drop to 115200 if uploads fail
monitor_speed = 9600         ; matches Serial.begin(9600) in the sketch
monitor_filters = esp8266_exception_decoder, time
; upload_port = COM3         ; set this if auto-detect picks the wrong port

lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.2.0
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit SSD1306@^2.5.9
