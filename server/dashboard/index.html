<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Garden Irrigation</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💧</text></svg>">
<style>
  :root {
    --bg: #f4f6f3; --card: #ffffff; --text: #1d2a1f; --muted: #66746a; --line: #dfe5dc;
    --accent: #2f7d4f; --accent-ink: #ffffff; --water: #1f6fb2; --warn: #b4531a; --off: #9aa59d;
    --chip: #eef2ec; --chip-on: #d7ecdf;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121713; --card: #1b221d; --text: #e3ebe4; --muted: #93a197; --line: #2b352e;
      --accent: #4fae78; --accent-ink: #0e1a12; --water: #5aa9e6; --warn: #e48a4f; --off: #5d6a61;
      --chip: #232c26; --chip-on: #24432f;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.35rem; margin: 4px 0 12px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .pill { font-size: .75rem; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: var(--chip); color: var(--muted); }
  .pill.ok { background: var(--chip-on); color: var(--accent); }
  .pill.bad { color: var(--warn); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin-bottom: 12px; }
  /* Device time, soil moisture and WiFi signal on one compact line */
  .card.stats-card { padding: 10px 14px; }
  .stats { display: flex; justify-content: space-between; gap: 10px; flex-wrap: nowrap; white-space: nowrap; }
  .stat { display: flex; align-items: baseline; gap: 5px; min-width: 0; }
  .stat .k { font-size: .75rem; color: var(--muted); }
  .stat .v { font-size: .95rem; font-weight: 600; font-variant-numeric: tabular-nums; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .valve-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
  .valve-head h2 { font-size: 1.05rem; margin: 0; }
  .badge { font-size: .8rem; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: var(--chip); color: var(--off); }
  .badge.on { background: var(--water); color: #fff; }
  label { font-size: .8rem; color: var(--muted); display: block; margin-bottom: 4px; }
  input[type=number], input[type=text], input[type=password] {
    font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 10px; width: 100%; }
  .tsel { display: flex; align-items: center; gap: 6px; }
  .tsel span { font-weight: 600; color: var(--muted); }
  .tsel select { font: inherit; font-variant-numeric: tabular-nums; color: var(--text); background: var(--bg);
                 border: 1px solid var(--line); border-radius: 8px; padding: 8px 6px; flex: 1; min-width: 0; text-align: center; }
  .times { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
  .days { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .day { border: 1px solid var(--line); background: var(--chip); color: var(--muted); border-radius: 8px;
         padding: 6px 0; width: 44px; text-align: center; font-size: .85rem; cursor: pointer; user-select: none; }
  .day.on { background: var(--chip-on); color: var(--accent); border-color: var(--accent); font-weight: 600; }
  button { font: inherit; font-weight: 600; border: 0; border-radius: 10px; padding: 9px 16px; cursor: pointer;
           background: var(--accent); color: var(--accent-ink); }
  button.secondary { background: var(--chip); color: var(--text); border: 1px solid var(--line); }
  button.water { background: var(--water); color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  /* Save / Clear / Water now always share one row, even on a phone */
  .valve-actions { display: flex; gap: 8px; flex-wrap: nowrap; }
  .valve-actions button { flex: 1 1 auto; white-space: nowrap; padding: 10px 10px; font-size: .9rem; }
  .valve-actions .clear { flex: 0 1 auto; }
  .valve .saved { display: block; min-height: 1.2em; margin-top: 6px; }
  .switch { display: flex; align-items: center; gap: 10px; cursor: pointer; }
  .switch input { width: 20px; height: 20px; accent-color: var(--accent); }
  .muted { color: var(--muted); font-size: .85rem; }
  .saved { color: var(--accent); font-size: .85rem; }
  form .grid { display: grid; gap: 10px; margin-bottom: 12px; }
  #loginMsg, #pwMsg { display: block; margin-top: 8px; color: var(--warn); }
  a { color: var(--accent); }
  .hidden { display: none !important; }
  @media (max-width: 420px) { .day { width: 38px; } }
</style>
</head>
<body>
<main>
  <h1>💧 Garden Irrigation <span id="conn" class="pill">Disconnected</span> <span id="dev" class="pill hidden">Device offline</span></h1>

  <form id="login" class="card hidden">
    <div class="grid">
      <div><label for="user">Username</label><input id="user" type="text" autocomplete="username" autocapitalize="none" required></div>
      <div><label for="pass">Password</label><input id="pass" type="password" autocomplete="current-password" required></div>
    </div>
    <button type="submit">Log in</button>
    <span id="loginMsg" class="muted"></span>
  </form>

  <form id="pwForm" class="card hidden">
    <h2 style="font-size:1.05rem;margin:0 0 6px">Change password</h2>
    <p id="pwNote" class="muted" style="margin:0 0 10px"></p>
    <div class="grid">
      <input type="text" autocomplete="username" id="pwUser" class="hidden" tabindex="-1" aria-hidden="true">
      <div><label for="pwCur">Current password</label><input id="pwCur" type="password" autocomplete="current-password" required></div>
      <div><label for="pwNew">New password (at least 8 characters)</label><input id="pwNew" type="password" autocomplete="new-password" minlength="8" required></div>
      <div><label for="pwNew2">Repeat new password</label><input id="pwNew2" type="password" autocomplete="new-password" minlength="8" required></div>
    </div>
    <div class="actions">
      <button type="submit">Change password</button>
      <button type="button" class="secondary" id="pwCancel">Cancel</button>
    </div>
    <span id="pwMsg" class="muted"></span>
  </form>

  <section id="app" class="hidden">
    <div class="card stats-card">
      <div class="stats">
        <div class="stat" title="Device time"><span class="k">Time</span><span class="v" id="sTime">–</span></div>
        <div class="stat" title="Soil moisture (raw sensor value)"><span class="k">Soil</span><span class="v" id="sMoist">–</span></div>
        <div class="stat" title="WiFi signal strength"><span class="k">WiFi</span><span class="v" id="sRssi">–</span></div>
      </div>
    </div>

    <div class="card">
      <div class="row">
        <label class="switch" style="margin:0;color:var(--text);font-size:1rem">
          <input id="rain" type="checkbox"> Rain mode <span class="muted">(pause schedules)</span>
        </label>
        <div style="display:flex;align-items:center;gap:8px">
          <span class="muted">Manual run</span>
          <input id="manualMin" type="number" min="1" max="240" style="width:80px">
          <span class="muted">min</span>
        </div>
      </div>
    </div>

    <div id="valves"></div>
    <p class="muted">Schedules are stored on the controller and keep running when it is offline.
      A stop time earlier than the start time runs past midnight.</p>
    <p class="muted">Signed in as <b id="whoami"></b> · <a href="#" id="changePw">Change password</a> · <a href="#" id="logout">Log out</a></p>
  </section>
</main>

<template id="valveTpl">
  <div class="card valve">
    <div class="valve-head">
      <h2></h2>
      <span class="badge">Off</span>
    </div>
    <div class="times">
      <div><label>Start</label><div class="tsel"><select class="start-h" aria-label="Start hour"></select><span>:</span><select class="start-m" aria-label="Start minute"></select></div></div>
      <div><label>Stop</label><div class="tsel"><select class="stop-h" aria-label="Stop hour"></select><span>:</span><select class="stop-m" aria-label="Stop minute"></select></div></div>
    </div>
    <div class="days"></div>
    <div class="valve-actions">
      <button class="secondary clear">Clear</button>
      <button class="water manual">Water now</button>
    </div>
    <span class="saved"></span>
  </div>
</template>

<script src="mqtt.min.js"></script>
<script>
const DEVICE = "garden";
const BASE = `irrigation/${DEVICE}`;
const DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const $ = (id) => document.getElementById(id);
let client = null;
let state = null;
const dirty = [false, false, false];

function store(k, v) { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }
function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

const pad = (n) => String(n).padStart(2, "0");

// Hour (00-23) and minute (00-59) pickers; "--" means no time set.
function fillTimeSelect(sel, count) {
  sel.add(new Option("--", ""));
  for (let n = 0; n < count; n++) sel.add(new Option(pad(n), String(n)));
}
function getTime(el, which) {
  const h = el.querySelector(`.${which}-h`).value, m = el.querySelector(`.${which}-m`).value;
  return h === "" ? -1 : Number(h) * 60 + Number(m || 0);
}
function setTime(el, which, mins) {
  el.querySelector(`.${which}-h`).value = mins < 0 ? "" : String(Math.floor(mins / 60));
  el.querySelector(`.${which}-m`).value = mins < 0 ? "" : String(mins % 60);
}

// ---- build valve cards
const valveEls = [];
for (let i = 0; i < 3; i++) {
  const el = $("valveTpl").content.firstElementChild.cloneNode(true);
  el.querySelector("h2").textContent = `Valve ${i + 1}`;
  const daysEl = el.querySelector(".days");
  DAYS.forEach((d, idx) => {
    const b = document.createElement("div");
    b.className = "day"; b.textContent = d; b.dataset.idx = idx;
    b.onclick = () => { b.classList.toggle("on"); markDirty(i); };
    daysEl.appendChild(b);
  });
  ["start", "stop"].forEach(which => {
    const h = el.querySelector(`.${which}-h`), m = el.querySelector(`.${which}-m`);
    fillTimeSelect(h, 24); fillTimeSelect(m, 60);
    h.addEventListener("change", () => {
      if (h.value === "") m.value = ""; else if (m.value === "") m.value = "0";   // picking an hour defaults minutes to :00
      markDirty(i);
    });
    m.addEventListener("change", () => {
      if (m.value !== "" && h.value === "") h.value = "0";
      if (m.value === "") h.value = "";
      markDirty(i);
    });
  });
  el.querySelector(".clear").onclick = () => {
    setTime(el, "start", -1); setTime(el, "stop", -1);
    el.querySelectorAll(".day").forEach(d => d.classList.remove("on"));
    markDirty(i);
  };
  el.querySelector(".manual").onclick = () => {
    const on = state && state.valves[i].manual;
    publish(`${BASE}/set/valve/${i + 1}/manual`, on ? "0" : "1", false);
  };
  $("valves").appendChild(el);
  valveEls.push(el);
}

// ---- schedules save automatically: a short pause after the last change, then publish.
// dirty[i] stays true (so incoming device state doesn't overwrite the form) until the
// controller reports the schedule we sent.
const saveTimers = [null, null, null];
const pending = [null, null, null];
const statusOf = (i) => valveEls[i].querySelector(".saved");

function markDirty(i) {
  dirty[i] = true;
  pending[i] = null;
  clearTimeout(saveTimers[i]);
  saveTimers[i] = setTimeout(() => autoSave(i), 600);
}

function autoSave(i) {
  const el = valveEls[i];
  const start = getTime(el, "start");
  const stop = getTime(el, "stop");
  if (start >= 0 && stop < 0) { statusOf(i).textContent = "Set a stop time to save"; return; }
  if (stop >= 0 && start < 0) { statusOf(i).textContent = "Set a start time to save"; return; }
  if (!client || !client.connected) { statusOf(i).textContent = "Not connected - will save when reconnected"; return; }
  const days = [...el.querySelectorAll(".day")].map(d => d.classList.contains("on") ? 1 : 0);
  pending[i] = { start, stop, days };
  publish(`${BASE}/set/valve/${i + 1}/schedule`, JSON.stringify(pending[i]), true);
  statusOf(i).textContent = "Saving…";
  clearTimeout(saveTimers[i]);
  saveTimers[i] = setTimeout(() => {
    if (pending[i]) statusOf(i).textContent = "Saved - the controller will apply it when it is online";
  }, 5000);
}

function confirmSaved(i, v) {
  const p = pending[i];
  if (!p || p.start !== v.start || p.stop !== v.stop || p.days.some((d, k) => d !== v.days[k])) return;
  pending[i] = null;
  dirty[i] = false;
  clearTimeout(saveTimers[i]);
  statusOf(i).textContent = "Saved ✓";
  saveTimers[i] = setTimeout(() => { if (!dirty[i]) statusOf(i).textContent = ""; }, 3000);
}

function publish(topic, payload, retain) {
  if (!client || !client.connected) return;
  client.publish(topic, payload, { qos: 1, retain });
}

function render() {
  if (!state) return;
  $("sTime").textContent = state.time ? state.time.slice(11) : "not set";
  $("sMoist").textContent = state.moisture;
  $("sRssi").textContent = state.rssi + " dBm";
  $("rain").checked = !!state.rain;
  if (document.activeElement !== $("manualMin")) $("manualMin").value = state.manual_minutes;
  state.valves.forEach((v, i) => {
    const el = valveEls[i];
    const badge = el.querySelector(".badge");
    badge.classList.toggle("on", v.on);
    badge.textContent = v.on ? (v.manual ? `Manual · ${Math.ceil(v.manual_left / 60)} min left` : "Watering") : "Off";
    el.querySelector(".manual").textContent = v.manual ? "Stop" : "Water now";
    confirmSaved(i, v);
    if (!dirty[i]) {
      setTime(el, "start", v.start);
      setTime(el, "stop", v.stop);
      el.querySelectorAll(".day").forEach((d, idx) => d.classList.toggle("on", !!v.days[idx]));
    }
  });
}

$("rain").onchange = (e) => publish(`${BASE}/set/rain`, e.target.checked ? "1" : "0", true);
$("manualMin").onchange = (e) => {
  const m = parseInt(e.target.value, 10);
  if (m > 0 && m <= 240) publish(`${BASE}/set/manual_minutes`, String(m), true);
};

function setConn(text, cls) { const c = $("conn"); c.textContent = text; c.className = "pill " + (cls || ""); }

// ---- screens: "login" | "password" | "app"
let me = null;
function show(screen, note) {
  $("login").classList.toggle("hidden", screen !== "login");
  $("pwForm").classList.toggle("hidden", screen !== "password");
  $("app").classList.toggle("hidden", screen !== "app");
  if (screen === "password") {
    $("pwForm").reset();
    $("pwUser").value = me ? me.username : "";
    $("pwNote").textContent = note || "";
    $("pwCancel").classList.toggle("hidden", !!(me && me.must_change));
    $("pwMsg").textContent = "";
    $("pwCur").focus();
  }
  if (screen === "login") { $("pass").value = ""; $("user").focus(); }
}

async function api(path, body) {
  const res = await fetch(path, body === undefined ? { credentials: "same-origin" } : {
    method: "POST", credentials: "same-origin",
    headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  let data = {};
  try { data = await res.json(); } catch (e) {}
  return { status: res.status, data };
}

function afterLogin(user) {
  me = user;
  $("whoami").textContent = user.username;
  if (user.must_change) show("password", "You are using the default password. Choose a new one to continue.");
  else { show("app"); connect(); }
}

function disconnect() {
  if (client) { client.end(true); client = null; }
  setConn("Disconnected");
}

async function sessionLost() {
  const { status } = await api("/api/me");
  if (status === 401) { disconnect(); me = null; show("login"); $("loginMsg").textContent = "Session expired, please log in again"; }
}

function connect() {
  if (client) client.end(true);
  setConn("Connecting…");
  // No MQTT credentials: the session cookie authorizes the WebSocket (checked by Caddy).
  client = mqtt.connect(`wss://${location.host}/mqtt`, { reconnectPeriod: 5000, connectTimeout: 10000,
                        clientId: "web-" + Math.random().toString(16).slice(2, 10) });
  client.on("connect", () => {
    setConn("Connected", "ok");
    client.subscribe([`${BASE}/state`, `${BASE}/status`], { qos: 1 });
    dirty.forEach((d, i) => { if (d && !pending[i]) autoSave(i); });   // send edits made while offline
  });
  client.on("message", (topic, msg) => {
    const s = msg.toString();
    if (topic.endsWith("/status")) {
      const dev = $("dev");
      dev.classList.remove("hidden");
      dev.textContent = s === "online" ? "Device online" : "Device offline";
      dev.className = "pill " + (s === "online" ? "ok" : "bad");
    } else if (topic.endsWith("/state")) {
      try { state = JSON.parse(s); render(); } catch (e) {}
    }
  });
  client.on("error", () => setConn("Error", "bad"));
  client.on("close", () => { setConn("Disconnected", "bad"); sessionLost(); });
}

$("login").onsubmit = async (e) => {
  e.preventDefault();
  $("loginMsg").textContent = "";
  const username = $("user").value.trim();
  const { status, data } = await api("/api/login", { username, password: $("pass").value });
  if (status === 200) { store("irr.user", username); afterLogin(data); }
  else { $("pass").value = ""; $("loginMsg").textContent = data.error || "Login failed"; }
};

$("pwForm").onsubmit = async (e) => {
  e.preventDefault();
  const msg = $("pwMsg");
  msg.textContent = "";
  if ($("pwNew").value !== $("pwNew2").value) { msg.textContent = "New passwords do not match"; return; }
  const { status, data } = await api("/api/password", { current: $("pwCur").value, new: $("pwNew").value });
  if (status === 200) { afterLogin(data); }
  else if (status === 401) { me = null; show("login"); $("loginMsg").textContent = "Session expired, please log in again"; }
  else msg.textContent = data.error || "Could not change password";
};
$("pwCancel").onclick = () => show("app");
$("changePw").onclick = (e) => { e.preventDefault(); show("password"); };

$("logout").onclick = async (e) => {
  e.preventDefault();
  disconnect();
  await api("/api/logout", {});
  me = null; state = null;
  show("login");
};

// Forget credentials saved by the earlier (MQTT-login) version of this page
store("irr.pass", null);
const savedUser = load("irr.user");
if (savedUser && savedUser !== "web") $("user").value = savedUser;
api("/api/me").then(({ status, data }) => status === 200 ? afterLogin(data) : show("login"));
</script>
</body>
</html>
