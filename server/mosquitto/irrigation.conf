# Irrigation broker settings (installed to /etc/mosquitto/conf.d/irrigation.conf)
per_listener_settings false
allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/acl

# Local plain MQTT (for mosquitto_sub/pub on the server itself)
listener 1883 127.0.0.1

# WebSockets for the dashboard; Caddy terminates HTTPS and proxies /mqtt here
listener 9001 127.0.0.1
protocol websockets
