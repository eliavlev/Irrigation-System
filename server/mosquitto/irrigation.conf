# Irrigation broker settings (installed to /etc/mosquitto/conf.d/irrigation.conf)
per_listener_settings true

# Local plain MQTT (for mosquitto_sub/pub on the server itself)
listener 1883 127.0.0.1
allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/acl

# WebSockets for the dashboard. Only reachable from this machine: Caddy proxies
# /mqtt here after irrigation-auth has checked the user's login session, so no
# MQTT password is needed (or exposed) in the browser.
listener 9001 127.0.0.1
protocol websockets
allow_anonymous true
acl_file /etc/mosquitto/acl-web
